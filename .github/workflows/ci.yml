name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phplint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          coverage: none
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/parallel-lint --exclude vendor --exclude node_modules .

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }} / WP ${{ matrix.wp }}${{ matrix.multisite == '1' && ' / multisite' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "7.4", wp: "7.0", multisite: "0" }
          - { php: "8.2", wp: "latest", multisite: "0" }
          - { php: "8.5", wp: "latest", multisite: "0" }
          # Multisite resolves several settings through network options rather
          # than per-site ones, so the account checks need their own run.
          - { php: "8.2", wp: "latest", multisite: "1" }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: mysqli
          coverage: none
          tools: composer
      - run: sudo apt-get update && sudo apt-get install -y subversion
      - run: composer install --no-progress --prefer-dist
      - run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true
      - run: vendor/bin/phpunit
        env:
          WP_MULTISITE: ${{ matrix.multisite }}

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/phpcs -q --runtime-set ignore_warnings_on_exit 1

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/phpstan analyse --memory-limit=2G

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
        with:
          path: security-check-report
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli
          coverage: none
          tools: wp-cli
      - name: Set up WordPress
        run: |
          wp core download --version=latest --path=wp
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --path=wp --skip-check
          wp core install --url=http://localhost:8080 --title=Test --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email --path=wp
          mkdir -p wp/wp-content/plugins
          cp -r security-check-report wp/wp-content/plugins/
          # Strip dev-only files so the check sees what actually ships to wp.org (see .distignore)
          cd wp/wp-content/plugins/security-check-report
          rm -rf .git .github .wordpress-org .distignore .gitignore .gitattributes .phpcs.cache .phpunit.result.cache bin tests phpunit.xml.dist phpcs.xml.dist phpstan.neon phpstan-bootstrap.php composer.json composer.lock vendor README.md
      - name: Install Plugin Check
        run: wp plugin install plugin-check --activate --path=wp
      - name: Run Plugin Check
        run: wp plugin check security-check-report --severity=error --format=table --path=wp
